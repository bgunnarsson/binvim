name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run when a new commit is pushed to the same
# ref — keeps the queue from backing up on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A tree-sitter pathology can pin a test job outright rather than fail
    # it, and with no cap that burns a runner until GitHub's six-hour
    # default. The ceiling has to clear the fuzz suite's seed-driven
    # spread, which is wide: ubuntu has run the same commit in 121s and in
    # 740s. 30 minutes leaves that slowest observed run a wide margin while
    # still failing a genuine hang promptly.
    timeout-minutes: 30
    strategy:
      # Each platform runs independently — a Windows-specific regression
      # shouldn't mask a Linux-specific one and vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-test-${{ matrix.os }}

      # `--test-threads=1` runs tests sequentially. Locally this is
      # ~5s slower across the full suite but keeps the failing-test
      # name interpretable when a tree-sitter grammar SIGSEGVs from
      # the C side (no Rust panic, output captured per-test and lost
      # on crash). With parallel execution the test that crashes is
      # one of `num_cpus` in-flight, and only the ones that finished
      # before the crash printed their result. Sequential execution
      # means the last `... ok` line is the test that immediately
      # preceded the one that crashed.
      - name: cargo test
        run: cargo test --locked --all-features -- --test-threads=1

  clippy:
    name: cargo clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # Pinned, unlike the other jobs: with warnings denied, a floating
      # `stable` would fail main the day a release adds a lint the code
      # trips. New lints arrive by bumping this, locally first.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy

      - name: cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-clippy-1.98.0-${{ matrix.os }}

      # Any warning fails the job — clippy lints and rustc's own (dead code,
      # unused imports) alike. Running on all three OSes catches warnings in
      # `#[cfg]`-gated code the other platforms never compile.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  fmt:
    name: cargo fmt --check
    # Formatting is platform-agnostic — verify on the cheapest runner only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Style policy lives in `rustfmt.toml` at the repo root:
      # `max_width = 100` + `single_line_let_else_max_width = 100`
      # preserve the compact let-else / single-line forms binvim
      # leans on. The 0.4.4 cut ran `cargo fmt` once to normalise
      # the tree; this gate keeps it that way.
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check
